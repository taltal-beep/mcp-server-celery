name: Release

on:
  push:
    tags: ["v*"]

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package and server.json versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv version --short)"
          srv="$(jq -r .version server.json)"
          srv_pkg="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$tag pyproject=$pkg server.json=$srv server.json package=$srv_pkg"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$srv" ] && [ "$tag" = "$srv_pkg" ]
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait for the release on PyPI
        run: |
          for _ in $(seq 30); do
            curl -fs "https://pypi.org/pypi/mcp-server-celery/${GITHUB_REF_NAME#v}/json" > /dev/null && exit 0
            sleep 10
          done
          echo "Version not visible on PyPI after 5 minutes" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
